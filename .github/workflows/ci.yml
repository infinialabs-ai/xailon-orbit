name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authorize private xailon-relay dependency
        env:
          RELAY_REPO_TOKEN: ${{ secrets.RELAY_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${RELAY_REPO_TOKEN}@github.com/infinialabs-ai/xailon-relay".insteadOf "git@github.com:infinialabs-ai/xailon-relay"
          git config --global --add url."https://x-access-token:${RELAY_REPO_TOKEN}@github.com/infinialabs-ai/xailon-relay".insteadOf "https://github.com/infinialabs-ai/xailon-relay"
          echo CARGO_NET_GIT_FETCH_WITH_CLI=true >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run lint` writes fixes; CI only reports them.
      - run: pnpm exec biome ci
      - run: pnpm exec lerna exec -- tsc --noEmit
      - run: pnpm test
      - run: pnpm -C packages/xailonorbit build
      - run: pnpm --filter xailonorbit-extension build

  rust:
    # The Tauri crate compiles against the system WebView, which macOS provides without extra packages.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authorize private xailon-relay dependency
        env:
          RELAY_REPO_TOKEN: ${{ secrets.RELAY_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${RELAY_REPO_TOKEN}@github.com/infinialabs-ai/xailon-relay".insteadOf "git@github.com:infinialabs-ai/xailon-relay"
          git config --global --add url."https://x-access-token:${RELAY_REPO_TOKEN}@github.com/infinialabs-ai/xailon-relay".insteadOf "https://github.com/infinialabs-ai/xailon-relay"
          echo CARGO_NET_GIT_FETCH_WITH_CLI=true >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The Tauri crate embeds the frontend build at compile time.
      - run: pnpm -C packages/xailonorbit build
      - run: cargo check --workspace
      - run: cargo test -p xailonorbit-daemon
